 on pages, budget, timing, and scope.": "Fahami perniagaan, khalayak dan matlamat anda; tetapkan halaman, bajet, tempoh serta skop kerja.", "Organize the content and page structure, then define colors, typography, and key page designs.": "Susun kandungan dan struktur halaman, kemudian tentukan warna, tipografi serta reka bentuk halaman utama.", "Build the approved pages, refine responsive layouts and interactions, and share a preview for your feedback.": "Bina halaman yang diluluskan, perhalus susun atur responsif dan interaksi, lalu kongsi pratonton untuk maklum balas anda.", "Review content, links, and key functions, then launch and hand over the site with the agreed support.": "Semak kandungan, pautan dan fungsi utama, kemudian lancarkan serta serahkan laman web dengan sokongan yang dipersetujui.", "Create a complete experience for a new site, or a stronger direction for an existing one.": "Cipta pengalaman lengkap untuk laman web baharu, atau arah yang lebih baik untuk laman web sedia ada.", "A new website, a redesign, or an idea taking shape—let’s talk. Share your business, goals, budget, and timeline, and we’ll work out the right direction.": "Laman web baharu, reka bentuk semula atau idea yang masih berkembang—mari berbincang. Kongsikan perniagaan, matlamat, bajet dan tempoh anda supaya kita dapat menentukan arah yang sesuai.", "Good work starts with a thoughtful conversation. I listen closely and help turn your ideas into a clear direction.": "Hasil kerja yang baik bermula dengan perbualan yang teliti. Saya mendengar dan membantu membentuk idea anda menjadi arah yang jelas.", "Kenny’s contact details are coming soon": "Maklumat hubungan Kenny akan tersedia tidak lama lagi", "Flip character ID card": "Balikkan kad identiti watak", "IDEAS IN PROGRESS": "IDEA SEDANG BERKEMBANG", "A universe at the desk": "Sebuah dunia di meja kerja", "Multiple screens, headphones, and a warm desk light. A character turns away from his creative world for a brief moment of connection.": "Beberapa skrin, fon kepala dan cahaya meja yang hangat. Watak berpaling daripada dunia kreatifnya untuk seketika berhubung dengan anda.", "CREATIVE MODE": "MOD KREATIF", "PLAY IS A PRACTICE": "BERMAIN JUGA SATU LATIHAN", "Neon room / character study": "Bilik neon / kajian watak", "A game becomes a small stage in a blue-violet room. From concentration to a friendly wave, a love of play gives every expression a purpose.": "Permainan menjadi pentas kecil di bilik biru ungu. Daripada tumpuan penuh hingga lambaian mesra, minat bermain memberi makna pada setiap ekspresi.", "PLAY MODE": "MOD BERMAIN", "ONE MORE REP": "SATU ULANGAN LAGI", "In motion / an everyday ritual": "Bergerak / rutin harian", "One push-up, a little surprise, and a face that refuses to give up. A complete action captures a different side of the same character.": "Satu tekan tubi, sedikit kejutan dan wajah yang enggan mengalah. Gerakan lengkap memperlihatkan sisi lain watak yang sama.", "MOVE MODE": "MOD GERAK", "THE ART OF SLOW": "SENI MEMPERLAHANKAN MASA", "A cat / an unhurried afternoon": "Seekor kucing / petang yang tenang", "A sofa, a phone, a ginger cat, and sunlight by the window. An afternoon when nothing much happens can still be a story worth keeping.": "Sofa, telefon, kucing jingga dan sinaran matahari di tingkap. Petang yang biasa juga boleh menjadi cerita yang berharga.", "LIFE MODE": "MOD KEHIDUPAN", "HELLO, YOU": "HAI, ANDA", "A wave / a new connection": "Lambaian / hubungan baharu", "Looking up from a phone, waving, smiling, and giving you his attention. A virtual character and a real viewer meet in a simple hello.": "Mengangkat pandangan daripada telefon, melambai, tersenyum dan memberi perhatian. Watak maya dan penonton sebenar bertemu melalui sapaan ringkas.", "CONNECT MODE": "MOD HUBUNG", "The video could not load. Please close and try again.": "Video tidak dapat dimuatkan. Sila tutup dan cuba lagi.", "A full-screen scene with the original character and framing preserved.": al draft, or take it to WhatsApp and review it before sending.": "Nyatakan matlamat, halaman, bajet dan tempoh projek. Simpan atau muat turun draf tempatan, atau buka di WhatsApp dan semak sebelum menghantar.", "Draft saved on this device. No message has been sent.": "Draf disimpan pada peranti ini. Tiada mesej dihantar.", "Local save failed. Browser storage may be disabled or full. Use Download TXT to keep your note.": "Simpanan tempatan gagal. Storan pelayar mungkin dinyahaktifkan atau penuh. Gunakan Muat Turun TXT untuk menyimpan nota.", "Website goals, pages, visual references, budget, and launch timing…": "Matlamat laman web, halaman, rujukan visual, bajet dan masa pelancaran…", "Hi Kenny, I’d like to discuss a website.": "Hai Kenny, saya ingin berbincang tentang laman web.", "Your brief is ready in WhatsApp. Review it there before sending.": "Ringkasan anda tersedia di WhatsApp. Semak sebelum menghantar.", "This project brief has not been sent to Kenny.": "Ringkasan projek ini belum dihantar kepada Kenny.", "Your project brief download has started. It has not been sent to Kenny.": "Muat turun ringkasan projek telah bermula. Ia belum dihantar kepada Kenny.", "The download could not start. Please copy the form contents to save them.": "Muat turun tidak dapat dimulakan. Sila salin kandungan borang untuk menyimpannya.", "Your draft on this device is loaded.": "Draf pada peranti ini telah dimuatkan.", "Drafts are stored on this device only after saving. No messages are sent.": "Draf disimpan pada peranti ini hanya selepas anda memilih Simpan. Tiada mesej dihantar.", "DESIGN MAKES YOU STOP.\nEXPERIENCE MAKES YOU STAY.": "REKA BENTUK MENARIK PERHATIAN.\nPENGALAMAN MEMBUAT ANDA KEKAL.", "Focused pages for a product, campaign or service, with clear benefits, enquiry forms and calls to action.": "Halaman berfokus untuk produk, kempen atau servis, dengan manfaat jelas, borang pertanyaan dan butang tindakan.", "Bring your story, expertise, portfolio and services together
